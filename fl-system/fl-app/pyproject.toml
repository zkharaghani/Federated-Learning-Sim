[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthfl"
version = "1.0.0"
description = "2-client federated linear regression on synthetic data (one SGD step per round)"
license = "Apache-2.0"
dependencies = ["flwr>=1.40.0", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fl-lab"

[tool.flwr.app.components]
serverapp = "synthfl.server_app:app"
clientapp = "synthfl.client_app:app"

[tool.flwr.app.config]
num-rounds = 30
num-clients = 2
lr = 0.5
lr-auto = true
batch-size = 32
samples-per-client = 500
wait-timeout = 600
eval-every = 5
